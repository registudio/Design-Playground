name: Refresh element registry

# Registry contents move week to week — Sora UI was observed going 139 items to 69
# inside one week — and the committed snapshot is what the Elements browser reads before
# anyone clicks refresh. Left alone it silently rots, and a stale entry means an install
# command that fails when someone runs it.
on:
  schedule:
    # Mondays, early UTC. Weekly matches how fast the sources actually move.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-registry
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch the five registries and open a PR on any change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Refreshed through the app's own route rather than a parallel script, so the
      # snapshot is produced by exactly the code the playground uses — one normalizer,
      # one set of per-source rules, no second implementation to drift.
      - name: Build and start
        run: |
          npm run build
          npm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/registry >/dev/null && exit 0
            sleep 2
          done
          echo "Server did not become ready" >&2
          exit 1

      - name: Refresh the snapshot
        run: |
          curl -sf -X POST http://localhost:3000/api/registry -o /tmp/refresh.json
          node -e '
            const index = require("/tmp/refresh.json");
            const failed = index.sources.filter((s) => !s.ok);
            for (const s of index.sources) {
              console.log(`${s.ok ? "ok  " : "FAIL"} ${s.id}: ${s.itemCount} items${s.error ? ` — ${s.error}` : ""}`);
            }
            // A refresh where everything failed would otherwise commit an unchanged file
            // and look like a success.
            if (failed.length === index.sources.length) { console.error("Every source failed"); process.exit(1); }
          '

      - name: Open a pull request if the index moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/registry-snapshot.json; then
            echo "No change — the registries published nothing new."
            exit 0
          fi

          node -e '
            const { execSync } = require("node:child_process");
            const before = JSON.parse(execSync("git show HEAD:data/registry-snapshot.json", { encoding: "utf8" }));
            const after = require("./data/registry-snapshot.json");
            const ids = (i) => new Set(i.elements.map((e) => e.id));
            const [a, b] = [ids(before), ids(after)];
            const added = [...b].filter((id) => !a.has(id));
            const removed = [...a].filter((id) => !b.has(id));
            const lines = [
              "Scheduled refresh of the five element registries.",
              "",
              `Total: ${before.elements.length} -> ${after.elements.length}`,
              "",
              ...(added.length ? ["### Added", "", ...added.slice(0, 40).map((id) => `- ${id}`), added.length > 40 ? `- …and ${added.length - 40} more` : ""] : []),
              ...(removed.length ? ["", "### Removed", "", "A removed entry means any project selecting it now holds an install command that will fail.", "", ...removed.slice(0, 40).map((id) => `- ${id}`), removed.length > 40 ? `- …and ${removed.length - 40} more` : ""] : []),
              "",
              "---",
              "_Generated by [Claude Code](https://claude.ai/code)_",
            ];
            require("node:fs").writeFileSync("/tmp/pr-body.md", lines.filter((l) => l !== "").join("\n") + "\n");
          '

          BRANCH="chore/refresh-registry-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/registry-snapshot.json
          git commit -m "Refresh the element registry snapshot"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Refresh the element registry snapshot" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH"
