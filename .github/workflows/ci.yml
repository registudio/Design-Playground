name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # include-hidden-files: upload-artifact v4 skips dot-files by default, and `.next`
      # is one, so this uploaded nothing and every e2e run failed at the download below
      # before a single browser test ran. public/engine-demos is generated by the build
      # and gitignored, so it travels too; the preview cache does not need to.
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
            public/engine-demos
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: Real-browser smoke tests
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      # DP_BRAND_ALLOW_ADDRESSES lets the brand reader fetch the fixture site that
      # e2e-brand-url serves on 127.0.0.1 — that address only; see brand/safe-fetch.ts.
      - name: Start server
        run: |
          DP_BRAND_ALLOW_ADDRESSES=127.0.0.1 npx next start -p 3100 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/ > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not become ready in time" >&2
          exit 1
        env:
          BASE_URL: http://localhost:3100

      - name: Run e2e smoke test
        run: npm run e2e
        env:
          BASE_URL: http://localhost:3100
          E2E_OUTPUT_DIR: ./e2e-output

      - name: Run element library navigation test
        run: npm run e2e:library
        env:
          BASE_URL: http://localhost:3100
          E2E_OUTPUT_DIR: ./e2e-output

      - name: Run export smoke test
        run: npm run e2e:export
        env:
          BASE_URL: http://localhost:3100
          E2E_OUTPUT_DIR: ./e2e-output

      - name: Run studio shell test
        run: npm run e2e:studio
        env:
          BASE_URL: http://localhost:3100
          E2E_OUTPUT_DIR: ./e2e-output

      - name: Run font upload test
        run: npm run e2e:fonts
        env:
          BASE_URL: http://localhost:3100
          E2E_OUTPUT_DIR: ./e2e-output

      - name: Run brand-from-website test
        run: npm run e2e:brand-url
        env:
          BASE_URL: http://localhost:3100
          E2E_OUTPUT_DIR: ./e2e-output

      - name: Run customisation smoke test
        run: npm run e2e:customisation
        env:
          BASE_URL: http://localhost:3100
          E2E_OUTPUT_DIR: ./e2e-output

      - name: Run preferences smoke test
        run: npm run e2e:preferences
        env:
          BASE_URL: http://localhost:3100
          E2E_OUTPUT_DIR: ./e2e-output

      - name: Run safety smoke test
        run: npm run e2e:safety
        env:
          BASE_URL: http://localhost:3100
          E2E_OUTPUT_DIR: ./e2e-output

      - name: Run dropzone smoke test
        run: npm run e2e:dropzone
        env:
          BASE_URL: http://localhost:3100
          E2E_OUTPUT_DIR: ./e2e-output

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-output
          retention-days: 7
