name: Render every element

# The full-catalogue check — every element opened in the real app, in its card and full
# screen, timed from its own paint timeline — takes over an hour in one process, so it
# was only ever run by hand. Split eight ways it fits a nightly run, and it is the check
# that caught the unbudgeted authored previews, the engine bundles blocking first paint
# and the stale full-screen URL. See scripts/e2e-render-all.mjs for what fails a view.
#
# It runs against the stand-in registry in `--healthy` mode with STRICT=1: every item is
# meant to render there, so a slow, empty or stand-in view is this app's fault rather
# than a third-party component's or a registry being down that night.
on:
  schedule:
    # Nightly, early UTC, clear of the Monday registry refresh at 05:17.
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: render-all
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # public/engine-demos is generated by the build and gitignored, so it has to travel
      # with .next; without it every engine card would 404 its runtime.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: render-all-build
          path: |
            .next
            public/engine-demos
          include-hidden-files: true
          retention-days: 1

  render:
    name: Shard ${{ matrix.shard }} of 8
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: render-all-build

      - name: Start the stand-in registry and the app
        run: |
          node scripts/mock-registry.mjs 4599 --healthy &
          DP_REGISTRY_BASE=http://127.0.0.1:4599 npx next start -p 3100 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/ > /dev/null && curl -sf http://127.0.0.1:4599/r/registry.json > /dev/null && exit 0
            sleep 1
          done
          echo "Server or stand-in registry did not become ready in time" >&2
          exit 1

      # Measured as a running deployment serves them, from the disk cache. Straight after
      # a build every registry card is a first-ever compile, and some take just over the
      # 3s budget that way while taking ~1.5s warm; the cold path and every failure shape
      # are covered separately by e2e:preview-states.
      - name: Warm every registry preview
        run: npm run warm:previews
        env:
          DP_PREVIEW_BASE: http://localhost:3100
          WARM: all
          CONCURRENCY: "4"

      - name: Render shard
        run: npm run e2e:render-all
        env:
          BASE_URL: http://localhost:3100
          STRICT: "1"
          SHARD: ${{ matrix.shard }}/8
          E2E_OUTPUT_DIR: ./e2e-output/render-all

      - name: Upload report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-all-shard-${{ matrix.shard }}
          path: e2e-output/render-all
          retention-days: 14
